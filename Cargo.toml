[workspace]
resolver = "3"
members = [
    "crates/gaebboss-cli",
    "crates/gaebboss-core",
    "crates/gaebboss-py",
    "crates/gaebboss-testkit",
    "crates/gaebboss-tui",
    "xtask",
]

[workspace.package]
version = "0.2.0" # x-release-please-version
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4thel00z/gaebboss"
homepage = "https://gaebboss.dev"
readme = "README.md"
keywords = ["gaeb", "construction", "bill-of-quantities", "xml", "ava"]

[workspace.dependencies]
gaebboss-core = { path = "crates/gaebboss-core", version = "0.2.0" } # x-release-please-version
gaebboss-testkit = { path = "crates/gaebboss-testkit" }
gaebboss-tui = { path = "crates/gaebboss-tui", version = "0.2.0" } # x-release-please-version
memchr = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
roxmltree = "0.21"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
